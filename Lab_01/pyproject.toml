[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-booking"
version = "0.1.0"
description = "Система бронювання готелю"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
hotel-booking = "hotel_booking.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]